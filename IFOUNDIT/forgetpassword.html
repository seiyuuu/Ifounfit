<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFoundIT - Set New Password</title>
    <!-- Stylesheets and Icons -->
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="loginfinal.css">
    <link rel="stylesheet" href="forgetpassword.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="forget.js"></script>   
</head>
<body class="login-body">

    <!-- Top Left Home Button -->
    <a href="home.html" class="top-left-home">
        <i class="fa-solid fa-arrow-left"></i> Home
    </a>

    <div class="login-wrapper">

        <!-- Logo Header -->
        <div class="login-logo-header">
            <img src="LOGO.png" alt="IFoundIT Logo">
            <span>IFoundIT</span>
        </div>

        <!-- Main Card Container -->
        <div class="login-card">
            <h2>Set New Password</h2>
            <p class="login-subtitle">Please choose a secure new password for your account</p>

            <form id="resetForm">
                <!-- New Password Field -->
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="newPassword" 
                            required 
                            placeholder="New Password"
                        >
                        <i class="fa-regular fa-eye-slash toggle-password" id="toggleNewPassword"></i>
                    </div>
                    
                    <!-- Requirements Checklist (Indicator Bar Removed) -->
                    <div class="strength-meter-container">
                        <ul class="requirements-list">
                            <li id="reqLength"><i class="fa-solid fa-circle-xmark"></i> At least 8 characters</li>
                            <li id="reqUpper"><i class="fa-solid fa-circle-xmark"></i> At least one uppercase letter (A-Z)</li>
                            <li id="reqNumber"><i class="fa-solid fa-circle-xmark"></i> At least one number (0-9)</li>
                            <li id="reqSpecial"><i class="fa-solid fa-circle-xmark"></i> At least one special character (!@#$%^&*)</li>
                        </ul>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            required 
                            placeholder="Re-enter your new password"
                        >
                        <i class="fa-regular fa-eye-slash toggle-password" id="toggleConfirmPassword"></i>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="button" id="submitBtn" class="login-btn" onclick="passwordUpdated()">Update Password</button>

                <div class="forgot-wrapper">
                    <a href="loginfinal.html" class="forgot-link">Back to Login</a>
                </div>
            </form>
        </div>

    </div>

    <!-- JavaScript for Live Checklist Validation and Redirect -->
    <script>
        const newPasswordInput = document.getElementById("newPassword");
        const confirmPasswordInput = document.getElementById("confirmPassword");
        
        const reqLength = document.getElementById("reqLength");
        const reqUpper = document.getElementById("reqUpper");
        const reqNumber = document.getElementById("reqNumber");
        const reqSpecial = document.getElementById("reqSpecial");
       

        // Live Checklist Validation
        newPasswordInput.addEventListener("input", function() {
            let val = newPasswordInput.value;

            if (val.length >= 8) {
                reqLength.classList.add("valid");
                reqLength.innerHTML = '<i class="fa-solid fa-circle-check"></i> At least 8 characters';
            } else {
                reqLength.classList.remove("valid");
                reqLength.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> At least 8 characters';
            }

            if (/[A-Z]/.test(val)) {
                reqUpper.classList.add("valid");
                reqUpper.innerHTML = '<i class="fa-solid fa-circle-check"></i> At least one uppercase letter (A-Z)';
            } else {
                reqUpper.classList.remove("valid");
                reqUpper.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> At least one uppercase letter (A-Z)';
            }

            if (/[0-9]/.test(val)) {
                reqNumber.classList.add("valid");
                reqNumber.innerHTML = '<i class="fa-solid fa-circle-check"></i> At least one number (0-9)';
            } else {
                reqNumber.classList.remove("valid");
                reqNumber.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> At least one number (0-9)';
            }

            if (/[!@#$%^&*(),.?":{}|<>]/.test(val)) {
                reqSpecial.classList.add("valid");
                reqSpecial.innerHTML = '<i class="fa-solid fa-circle-check"></i> At least one special character (!@#$%^&*)';
            } else {
                reqSpecial.classList.remove("valid");
                reqSpecial.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> At least one special character (!@#$%^&*)';
            }
        });

        // Toggle Password Visibility
        const toggleNewPassword = document.querySelector('#toggleNewPassword');
        if (toggleNewPassword) {
            toggleNewPassword.addEventListener('click', function () {
                const type = newPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                newPasswordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        }

        const toggleConfirmPassword = document.querySelector('#toggleConfirmPassword');
        if (toggleConfirmPassword) {
            toggleConfirmPassword.addEventListener('click', function () {
                const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmPasswordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        }

        // Password Updated Function with Green Button and 1-second redirect
        function passwordUpdated() {
            let newPassword = newPasswordInput.value.trim();
            let confirmPassword = confirmPasswordInput.value.trim();
            let submitBtn = document.getElementById("submitBtn");

            let hasLength = newPassword.length >= 8;
            let hasUpper = /[A-Z]/.test(newPassword);
            let hasNumber = /[0-9]/.test(newPassword);
            let hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(newPassword);

            if (newPassword === "" || confirmPassword === "") {
                alert("Please fill in all fields before submitting.");
            } else if (!hasLength || !hasUpper || !hasNumber || !hasSpecial) {
                alert("Please meet all password requirements before proceeding.");
            } else if (newPassword !== confirmPassword) {
                alert("Passwords do not match! Please check and try again.");
            } else {
                submitBtn.innerText = "PASSWORD UPDATED ✓";
                submitBtn.style.setProperty("background", "#10b981", "important");
                submitBtn.style.color = "#ffffff";
                submitBtn.style.cursor = "default";
                submitBtn.disabled = true;

                setTimeout(function() {
                    window.location.href = "loginfinal.html";
                }, 1000);
            }
        }
    </script>
</body>
</html>
