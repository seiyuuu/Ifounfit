<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFoundIT - Login</title>
    <!-- Reusable Global Styles -->
    <link rel="stylesheet" href="global.css">
    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="loginfinal.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <!-- Top Left Home Button (Naka-link sa home.html) -->
    <a href="home.html" class="top-left-home">
        <i class="fa-solid fa-arrow-left"></i> Home
    </a>

    <div class="login-wrapper">

        <!-- Logo Header -->
        <div class="login-logo-header">
            <img src="LOGO.png" alt="IFoundIT Logo">
            <span>IFoundIT</span>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <h2>Welcome Back!</h2>
            <p class="login-subtitle">Hello User!</p>

            <form id="loginForm">
                <!-- Email Field (Option B Placeholder) -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="Enter Email">
                </div>

                <!-- Password Field (Option B Placeholder) -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="Enter Password">
                        <i class="fa-regular fa-eye-slash toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <!-- Forgot Password Link -->
                <div class="forgot-wrapper">
                    <a href="forgetpassword.html" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn">Log In</button>
            </form>
        </div>

    </div>

    <!-- Script for Redirecting & Password Toggle -->
    <script>
        // Password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePassword) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        }

        // Form Redirects
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); 
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (email === "admin@ifoundit.edu" && password === "admin123") {
                sessionStorage.setItem("userRole", "admin");
                sessionStorage.setItem("userName", "Admin Stephen");
                window.location.href = "admin_report.html";
            } else {
                sessionStorage.setItem("userRole", "student");
                window.location.href = "dashboardfinal.html";
            }
        });
    </script>

</body>
</html>
